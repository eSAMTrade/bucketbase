# Run the whole suite concurrently in one JVM: test classes in parallel with each other, and the
# methods inside each class in parallel too.
#
# What makes this safe:
#  - JUnit's default PER_METHOD lifecycle gives every test method its own instance, so the
#    `storage`/`tester`/`@TempDir` fields are never shared;
#  - IBucketTester names every key under a per-instance UUID prefix, so tests sharing one live S3
#    bucket cannot see each other's objects;
#  - the one fixture with a fixed path (test-dir-with-2025-keys/) is created under a lock.
#
# A test that genuinely cannot share its resource must say so itself with @Execution(SAME_THREAD)
# or @ResourceLock, rather than by weakening these defaults for everyone.
junit.jupiter.execution.parallel.enabled=true
junit.jupiter.execution.parallel.mode.default=concurrent
junit.jupiter.execution.parallel.mode.classes.default=concurrent

# Size the pool from the machine, and let JUnit grow it when a test blocks on I/O - most of this
# suite waits on a network or a disk rather than on the CPU.
junit.jupiter.execution.parallel.config.strategy=dynamic
junit.jupiter.execution.parallel.config.dynamic.factor=2
